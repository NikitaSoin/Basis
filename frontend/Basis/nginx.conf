# Отдача статики фронта Basis.
#
# ЗАЧЕМ ЭТОТ ФАЙЛ ВООБЩЕ: до 2026-08-02 фронт обслуживал Caddy — встроенный статический
# хостинг Timeweb, конфигурация которого нам недоступна (ответ поддержки: «возможности
# настроить Caddy в приложении нет, рекомендуем деплой через Docker»). Из-за его
# SPA-фолбэка ЛЮБОЙ несуществующий адрес отвечал 200 и отдавал главную — на это ругался
# Яндекс.Вебмастер («некорректно настроено отображение несуществующих страниц»), и на это
# же впустую тратился бюджет обхода.
#
# 🔴 ГЛАВНОЕ ОТЛИЧИЕ ОТ ПРЕЖНЕЙ ВЕРСИИ ЭТОГО ФАЙЛА: убран блок proxy_pass на
# http://backend:8000. Он имел смысл только в docker-compose, где рядом поднимается
# сервис backend. В отдельном контейнере фронта такого хоста НЕТ, а nginx резолвит имена
# апстримов при СТАРТЕ и падает с «host not found in upstream» — то есть сайт не
# поднялся бы вовсе. Фронту проксирование и не нужно: он ходит в API по абсолютному
# адресу из REACT_APP_API_URL.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Сжатие обязательно: без него прокси Timeweb резал большие ответы (см. историю с
    # каталогом облигаций). Плюс это прямо ускоряет обход — робот берёт больше страниц.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml image/svg+xml application/rss+xml;

    # Хешированные ассеты (main.<hash>.js/css) иммутабельны — кэшируем надолго.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Карты сайта и ключ IndexNow — отдаём как есть, без кэша: они меняются на каждой
    # сборке, а поисковик должен видеть свежие.
    location ~* ^/(sitemap[^/]*\.xml|robots\.txt|[0-9a-f]{32}\.txt)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 🔴 Карточки компаний — единственное место, где фолбэк НУЖЕН. Страницы вкладок
    # генерируются не для всех компаний (нет данных — нет страницы), но приложение умеет
    # открыть любую вкладку по адресу /company/<ТИКЕР>/<вкладка>/. Отдаём хаб этой
    # компании: адрес останется прежним, приложение прочитает его и откроет нужную
    # вкладку. Если самой компании нет — уходим в 404, а не показываем главную.
    location ~ ^/company/([A-Za-z0-9-]+)/ {
        try_files $uri $uri/ /company/$1/index.html =404;
    }

    # Всё остальное: есть файл — отдаём, нет — честный 404. Реальные адреса платформы
    # существуют файлами (около 8500 страниц), поэтому строгий режим ничего не ломает.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Страница 404 лежит в сборке (public/404.html). internal — чтобы её нельзя было
    # получить как обычный документ с кодом 200 и тем самым завести дубль в индексе.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }
}
